<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D Reality Capture Viewer - AGRDB</title>
<link rel="icon" type="image/x-icon" href="assets/logo_AGRDB.ico" />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root{--navy:#1b2b3c;--cyan:#00b4d8}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--navy);font-family:Montserrat,Arial,sans-serif;color:#fff}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .bar{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:5}
  .btn{background:rgba(27,43,60,.85);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:8px;padding:8px 12px;font:600 13px Montserrat,Arial;cursor:pointer;text-decoration:none;backdrop-filter:blur(6px)}
  .btn:hover{border-color:var(--cyan)}
  .btn.on{background:var(--cyan);border-color:var(--cyan);color:#06222b}
  .layers .btn{padding:6px 10px;font-size:12px}
  .layers .btn:not(.on){opacity:.55}
  .title{margin-left:auto;font-weight:700;font-size:13px;background:rgba(27,43,60,.85);padding:8px 12px;border-radius:8px}
  .info{position:fixed;left:12px;bottom:12px;max-width:420px;background:rgba(27,43,60,.88);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:12px 14px;font-size:12px;line-height:1.55;z-index:5}
  .info b{color:var(--cyan)}
  .hint{position:fixed;right:12px;bottom:12px;font-size:11px;opacity:.7;z-index:5}
  #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--navy);z-index:10;font-size:13px}
  .spin{width:42px;height:42px;border:4px solid rgba(255,255,255,.15);border-top-color:var(--cyan);border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  @media (max-width:600px){.title{display:none}.info{right:12px;max-width:none;font-size:11px}.hint{display:none}}
</style>
</head>
<body>
<div id="loading"><div class="spin"></div><div id="ltext">Loading 3D model...</div></div>
<div class="bar">
  <a class="btn" href="index.html#portfolio">&larr; Back</a>
  <span id="modeBtns"><button class="btn on" id="bTex">Textured</button>
  <button class="btn" id="bElev">Elevation</button></span>
  <button class="btn" id="bRot">Auto-rotate</button>
  <button class="btn" id="bReset">Reset view</button>
  <span class="title" id="ttl"></span>
</div>
<div class="bar layers" id="layers" style="top:58px;display:none">
</div>
<div class="info" id="info"></div>
<div class="hint">Drag to rotate · Scroll to zoom · Right-drag to pan</div>
<canvas id="c"></canvas>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const MODELS = {
  formwork: { file: 'assets/models/formwork.glb', zup: true, textured: true,
    title: 'Formwork survey · Drone photogrammetry',
    info: '<b>Scan-to-BIM · Reality capture.</b> Formwork assembly and excavation reconstructed in WebODM from 151 drone images (2.9 M-point dense cloud, 0.3 cm ground sample distance). The mesh is used to read as-built geometry before modeling in Revit and Civil 3D.' },
  corridor: { file: 'assets/models/corridor.glb', zup: false, textured: false, layers: true,
    title: 'Urban road corridor · Federated model',
    info: '<b>Infrastructure BIM · Federated model.</b> Roadway (Civil 3D), bridge, box culvert and street lighting (Revit), water main and sewer networks — exported to IFC, aligned to one coordinate system and federated for coordination. Toggle each discipline above.' }
};
const key = new URLSearchParams(location.search).get('m') || 'formwork';
const CFG = MODELS[key] || MODELS.formwork;
document.getElementById('ttl').textContent = CFG.title;
document.getElementById('info').innerHTML = CFG.info;
document.title = CFG.title + ' - AGRDB';
if (!CFG.textured) document.getElementById('modeBtns').style.display = 'none';
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b2b3c);
scene.add(new THREE.AmbientLight(0xffffff, CFG.textured ? 2.2 : 1.1));
if (!CFG.textured) { const d = new THREE.DirectionalLight(0xffffff, 2.2); d.position.set(0.6, 1, 0.4); scene.add(d); scene.add(new THREE.HemisphereLight(0xdfe9f3, 0x3a4a5a, 0.9)); }
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 2000);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;

const draco = new DRACOLoader();
draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/libs/draco/gltf/');
const loader = new GLTFLoader();
loader.setDRACOLoader(draco);

let model, home, texMats = [], elevMat;
loader.load(CFG.file, (gltf) => {
  model = gltf.scene;
  if (CFG.zup) model.rotation.x = -Math.PI / 2;
  scene.add(model);
  model.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(model);
  model.position.sub(box.getCenter(new THREE.Vector3()));
  model.updateMatrixWorld(true);
  const b2 = new THREE.Box3().setFromObject(model);
  const size = b2.getSize(new THREE.Vector3());
  const r = Math.max(size.x, size.z);
  home = CFG.zup ? { pos: new THREE.Vector3(r * 0.55, r * 0.75, r * 0.65), tgt: new THREE.Vector3(0, -size.y * 0.15, 0) }
                 : { pos: new THREE.Vector3(-r * 0.62, r * 0.55, r * 0.55), tgt: new THREE.Vector3(-r * 0.05, 0, r * 0.12) };
  camera.near = r / 2000; camera.far = r * 20; camera.updateProjectionMatrix();
  if (CFG.layers) {
    const box = document.getElementById('layers'); box.style.display = 'flex';
    const colors = { Roadway: '#9fb6d9', Bridge: '#c9ced3', BoxCulvert: '#3dc2e9', Lighting: '#b6b6b6', Water: '#2f8cff', Sewer: '#d94fd9' };
    const labels = { BoxCulvert: 'Box culvert' };
    let L = model; while (L.children.length === 1 && !L.children[0].isMesh) L = L.children[0];
    L.children.forEach((g) => {
      const b = document.createElement('button'); b.className = 'btn on';
      b.innerHTML = '<span style="display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;background:' + (colors[g.name] || '#ccc') + '"></span>' + (labels[g.name] || g.name);
      b.onclick = () => { g.visible = !g.visible; b.classList.toggle('on', g.visible); };
      box.appendChild(b);
    });
  }
  // elevation material (vertex colors computed once)
  const minY = b2.min.y, maxY = b2.max.y;
  if (CFG.textured) model.traverse((o) => {
    if (!o.isMesh) return;
    o.material.side = THREE.DoubleSide;
    texMats.push([o, o.material]);
    const g = o.geometry, p = g.attributes.position, col = new Float32Array(p.count * 3), v = new THREE.Vector3(), c = new THREE.Color();
    for (let i = 0; i < p.count; i++) {
      v.fromBufferAttribute(p, i).applyMatrix4(o.matrixWorld);
      const t = (v.y - minY) / (maxY - minY);
      c.setHSL(0.66 - 0.66 * Math.min(1, Math.max(0, t)), 0.85, 0.5);
      col.set([c.r, c.g, c.b], i * 3);
    }
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  });
  elevMat = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide });
  resetView();
  document.getElementById('loading').style.display = 'none';
}, (e) => {
  if (e.total) document.getElementById('ltext').textContent = `Loading 3D model... ${Math.round(e.loaded / e.total * 100)}%`;
}, (err) => {
  document.getElementById('ltext').textContent = 'Could not load the model.';
  console.error(err);
});

function resetView() { camera.position.copy(home.pos); controls.target.copy(home.tgt); controls.update(); }
const bTex = document.getElementById('bTex'), bElev = document.getElementById('bElev'), bRot = document.getElementById('bRot');
bTex.onclick = () => { texMats.forEach(([o, m]) => o.material = m); bTex.classList.add('on'); bElev.classList.remove('on'); };
bElev.onclick = () => { texMats.forEach(([o]) => o.material = elevMat); bElev.classList.add('on'); bTex.classList.remove('on'); };
bRot.onclick = () => { controls.autoRotate = !controls.autoRotate; bRot.classList.toggle('on', controls.autoRotate); };
document.getElementById('bReset').onclick = () => home && resetView();

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
